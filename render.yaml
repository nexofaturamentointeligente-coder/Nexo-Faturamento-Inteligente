# NEXO - Faturamento Inteligente | Deploy no Render (Blueprint)
# ============================================================
# Cria 1 Web Service no plano FREE (sem cartão). No painel do Render:
#   New > Blueprint > selecione este repositório.
# As variáveis marcadas com `sync: false` são pedidas na criação (valores
# secretos — nunca vão para o Git). Passo a passo completo no README.
services:
  - type: web
    name: nexo-faturamento-inteligente
    runtime: python
    plan: free
    # Oregon = mesma região AWS do banco Supabase (us-west-2): menor latência.
    region: oregon
    branch: main
    # Build não altera o banco. Aplicar migrações revisadas separadamente antes
    # de liberar o tráfego, conforme Docs/PREPARACAO_RENDER.md.
    buildCommand: python -I tools/install_dependencies.py --requirements requirements.txt
    autoDeployTrigger: 'off'
    # 1 worker + threads: exigência do Flask-SocketIO em modo threading (ver wsgi.py).
    # timeout 180s: o ETL e o PDF rodam na requisição e o free tem só 0,1 CPU.
    startCommand: gunicorn -w 1 --threads 50 --timeout 180 -b 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      # Render fica atrás de 1 proxy reverso: IP real do cliente + links https.
      - key: PROXY_FIX_HOPS
        value: "1"
      # Supabase > Connect: Transaction pooler (6543) e Session pooler (5432).
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      # E-mail via API HTTPS do Brevo (o Render Free bloqueia SMTP).
      # Chave DE API (xkeysib-), não a SMTP. "sync: false" = o valor precisa
      # ser preenchido no painel; sem ele o envio fica DESATIVADO. Autorize os
      # IPs de saída do serviço no Brevo (Docs/EMAILS_TRANSACIONAIS.md).
      - key: BREVO_API_KEY
        sync: false
      # Remetente verificado no Brevo (Senders). Domínio gratuito não autentica:
      # para entregabilidade, troque por um endereço de domínio próprio.
      - key: MAIL_DEFAULT_SENDER
        value: NEXO - Faturamento Inteligente <nexofaturamentointeligente@gmail.com>
      # WhatsApp pela Evolution API, opcional (Docs/WHATSAPP_EVOLUTION.md). Sem a URL
      # (https), a chave e a instância, os disparos ficam desligados: só aviso no log.
      - key: EVOLUTION_API_URL
        sync: false
      - key: EVOLUTION_API_KEY
        sync: false
      - key: EVOLUTION_INSTANCE_NAME
        sync: false
      # Número comercial com DDI (ex.: 5562999999999) dos botões wa.me; vazio os esconde.
      - key: WHATSAPP_EMPRESA_NUMERO
        sync: false
