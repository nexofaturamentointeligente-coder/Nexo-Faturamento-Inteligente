name: NEXO Security CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexo-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"
  FLASK_ENV: development
  SECRET_KEY: synthetic-ci-only-not-production
  DATABASE_URL: "sqlite:///:memory:"
  DIRECT_URL: ""
  NEXO_DB_DIRECT: "0"
  BREVO_API_KEY: ""
  MAIL_USERNAME: ""
  MAIL_PASSWORD: ""
  ANTHROPIC_API_KEY: ""
  HF_API_TOKEN: ""

jobs:
  sqlite-browser:
    name: security-sqlite-browser
    runs-on: ubuntu-24.04
    # A suíte completa com navegador levava ~18 min na main (limite de 20); os
    # testes de e-mail transacional a passaram desse limite. Folga para crescer.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Ferramentas de PDF e PostgreSQL descartavel
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils postgresql postgresql-client
          pg_bin="$(pg_config --bindir)"
          test -x "$pg_bin/initdb"
          test -x "$pg_bin/pg_dump"
          echo "NEXO_TEST_POSTGRES_BIN=$pg_bin" >> "$GITHUB_ENV"
      - name: Instalador verificado e dependencias de teste
        run: python -I tools/install_dependencies.py --requirements requirements-dev.txt
      - name: Navegador de teste com suporte ao MP4 H.264 e AAC
        run: |
          python -m playwright install-deps chromium
          chrome_bin="$(command -v google-chrome)"
          test -x "$chrome_bin"
          echo "NEXO_TEST_CHROMIUM=$chrome_bin" >> "$GITHUB_ENV"
          "$chrome_bin" --version
      - name: Fontes do produto e copias integras da CDN para os testes de layout
        # Inter e JetBrains Mono (as mesmas do CSS) para o navegador medir o layout
        # com a tipografia real; Bootstrap 5.3.3 e Plotly 2.35.2 so sao usados se o
        # hash SRI conferir (os testes recalculam o hash do Bootstrap antes de servir).
        # O cliente Socket.IO 4.7.5 (o mesmo de cdn.socket.io) alimenta o teste de
        # horario em tempo real; sem a copia integra, esse teste e pulado.
        run: |
          sudo apt-get install --yes --no-install-recommends fonts-inter fonts-jetbrains-mono
          cdn_dir="$RUNNER_TEMP/nexo-cdn"
          mkdir -p "$cdn_dir"
          baixar() {
            curl --fail --silent --show-error --location --max-time 60 --output "$cdn_dir/$1" "https://cdn.jsdelivr.net/npm/$2"
            resumo="$(openssl dgst -sha384 -binary "$cdn_dir/$1" | openssl base64 -A)"
            if [ "$resumo" != "$3" ]; then
              echo "::warning::Hash SRI de $1 nao confere; copia descartada"
              rm -f "$cdn_dir/$1"
            fi
          }
          baixar bootstrap.min.css bootstrap@5.3.3/dist/css/bootstrap.min.css QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH || true
          baixar bootstrap.bundle.min.js bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz || true
          baixar plotly.min.js plotly.js-dist-min@2.35.2/plotly.min.js cCVCZkAjYNxaYKbM8lsArLznDF/SvMFr1jcZrvOpSTCa0W40ZAdLzHCEulnUa5i7 || true
          baixar socket.io.min.js socket.io-client@4.7.5/dist/socket.io.min.js 2huaZvOR9iDzHqslqwpR87isEmrfxqyWOF7hr7BY6KG0+hVKLoEXMPUJw3ynWuhO || true
          # SEC-009: com SRI nos templates, toda cópia servida nos testes de navegador precisa ser íntegra.
          baixar bootstrap-icons.min.css bootstrap-icons@1.11.3/font/bootstrap-icons.min.css XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+ || true
          # Fontes que essa CSS carrega (sem SRI possível); sem a cópia, os testes servem corpo vazio.
          for fonte in bootstrap-icons.woff2 bootstrap-icons.woff; do
            curl --fail --silent --show-error --location --max-time 60 --output "$cdn_dir/$fonte" "https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/fonts/$fonte" || true
          done
          # Falha de download ou de hash: avisa quais testes serao pulados.
          for copia in bootstrap.min.css:layout bootstrap.bundle.min.js:layout plotly.min.js:layout socket.io.min.js:HorarioBrasiliaNavegadorTests; do
            test -s "$cdn_dir/${copia%%:*}" || echo "::warning::${copia%%:*} indisponivel; testes pulados: ${copia#*:}"
          done
          ls -l "$cdn_dir"
          echo "NEXO_TEST_CDN_DIR=$cdn_dir" >> "$GITHUB_ENV"
      - name: Suite completa, navegador e ensaio de backup
        env:
          NEXO_TEST_BROWSER: "1"
        run: |
          test_status=0
          {
          python -B -m unittest discover -s tests -t . -v
          } > "$RUNNER_TEMP/nexo-tests.log" 2>&1 || test_status=$?
          cat "$RUNNER_TEMP/nexo-tests.log"
          if [ "$test_status" -ne 0 ]; then
            python - <<'PY'
          import os
          import re
          from pathlib import Path
          log = (Path(os.environ["RUNNER_TEMP"]) / "nexo-tests.log").read_text(errors="replace")
          blocks = re.findall(r"^(?:FAIL|ERROR): .*?(?=^={10,}\s*$|^-{10,}\nRan |\Z)", log, re.M | re.S)
          for block in blocks[:10]:
              message = block[:6000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::error title=Falha unittest::" + message)
          if not blocks:
              print("::error title=Falha unittest::A suíte terminou com erro; consultar o log do job.")
          PY
          fi
          exit "$test_status"

  postgresql-security:
    name: security-postgresql
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Binarios para o servico PostgreSQL isolado
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql postgresql-client
          pg_bin="$(pg_config --bindir)"
          test -x "$pg_bin/initdb"
          echo "NEXO_TEST_POSTGRES_BIN=$pg_bin" >> "$GITHUB_ENV"
          "$pg_bin/postgres" --version
      - name: Instalador verificado e dependencias de teste
        run: python -I tools/install_dependencies.py --requirements requirements-dev.txt
      - name: Tokens e concorrencia no PostgreSQL real
        run: python -B -m unittest tests.postgresql_auth_tokens -v
      - name: Sessoes e corridas de notificacao no PostgreSQL real
        run: python -B -m unittest tests.postgresql_session_revocation -v
      - name: Restauracao de empresas e concorrencia no PostgreSQL real
        run: python -B -m unittest tests.postgresql_company_restore_security -v
      - name: Migracao SEC-004 com dados anteriores no PostgreSQL real
        run: python -B -m unittest tests.postgresql_company_restore_migration -v
      - name: ETL, limites, atomicidade e uploads concorrentes no PostgreSQL real
        run: python -B -m unittest tests.postgresql_etl_resource_security -v
      - name: Configuracoes da conta, RLS e corridas no PostgreSQL real
        run: python -B -m unittest tests.postgresql_configuracoes -v

  supply-chain:
    name: security-sca-sast
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Ferramentas CI-only, com versão fixa. Advisórios: estes passos informam,
      # mas não travam o PR (continue-on-error). Os achados ficam no resumo do job
      # para triagem humana; nenhuma dependência é trocada automaticamente e nenhum
      # teste de segurança é reduzido para passar.
      - name: Ferramentas de SCA/SAST
        continue-on-error: true
        run: pip install "pip-audit==2.7.3" "bandit==1.7.9"
      - name: SCA — pip-audit (dependências vulneráveis)
        continue-on-error: true
        run: |
          echo "## SCA — pip-audit" >> "$GITHUB_STEP_SUMMARY"
          pip-audit --requirement requirements.txt --progress-spinner off \
            --desc on --format markdown >> "$GITHUB_STEP_SUMMARY" || true
      - name: SAST — bandit (padrões inseguros no código)
        continue-on-error: true
        run: |
          bandit --recursive . \
            --exclude ./tests,./migrations,./.audit_tmp,./tools/nexo-motion \
            --severity-level medium --confidence-level medium --format screen || true
      - name: Secret scanning — varredura leve de segredos
        continue-on-error: true
        run: python -I tools/varredura_segredos.py
